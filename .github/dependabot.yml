version: 2
updates:
  - package-ecosystem: dotnet-sdk
    directory: '/'
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'

  - package-ecosystem: nuget
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'build'
    groups:
      Aspire:
        patterns:
          - 'Aspire.*'
          - 'Microsoft.Extensions.ServiceDiscovery.*'
      EntityFrameworkCore:
        patterns:
          - 'Microsoft.EntityFrameworkCore.*'
      MicrosoftExtensions:
        patterns:
          - 'Microsoft.Extensions.*'
      Npgsql:
        patterns:
          - 'Npgsql.*'
      OpenTelemetry:
        patterns:
          - 'OpenTelemetry.*'
      Roslynator:
        patterns:
          - 'Roslynator.*'


  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly

